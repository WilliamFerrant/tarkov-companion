# Publication d'une version installable, consommee par l'auto-updater.
#
# Declenchement : un tag `vX.Y.Z` pousse sur le depot.
#
# Pourquoi un tag plutot qu'un push sur `main` : une release est un acte
# deliberе. Publier a chaque fusion imposerait un telechargement a l'utilisateur
# pour n'importe quel correctif de commentaire, et rendrait impossible de fusionner
# plusieurs changements avant de livrer.
#
# `electron-builder --publish always` televerse l'installeur **et** le fichier
# `latest.yml`. Ce dernier est ce que lit `electron-updater` pour savoir qu'une
# version plus recente existe : sans lui, l'auto-mise a jour ne verrait jamais
# rien, meme avec une release presente.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Necessaire pour creer la release et y televerser les fichiers.
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Garde-fou : `electron-builder` lit la version dans package.json, pas dans
      # le tag. Les deux qui divergent produiraient une release `v1.2.0`
      # contenant un installeur `1.1.0`, et un `latest.yml` annoncant une version
      # que l'updater ne retrouverait jamais. L'incoherence est silencieuse : on
      # la transforme en echec immediat.
      - name: Verifier que le tag correspond a package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Le tag ($tag) ne correspond pas a package.json ($pkg). Alignez les deux avant de taguer."
            exit 1
          }
          Write-Output "Version $pkg confirmee."

      - name: Verifier le typage
        run: npm run typecheck

      - name: Correspondance floue (Node pur)
        run: npm run test:match

      - name: Compiler
        run: npm run build

      # Cree la release AVANT electron-builder, pour lui eviter d'avoir a le faire.
      #
      # electron-builder televerse ses artefacts en parallele, et chaque envoi
      # cree la release si elle manque. Les appels se croisent : la v1.0.1 a
      # produit **deux releases pour le meme tag**, a une seconde d'ecart, avec
      # `latest.yml` dans l'une et le blockmap dans l'autre.
      #
      # Sans consequence fonctionnelle — GitHub sert les fichiers par tag, et les
      # deux le partagent — mais la page des releases affiche deux entrees
      # identiques, et `/releases/latest` designe celle qui ne contient pas
      # `latest.yml`. Une release deja presente supprime la course.
      - name: Creer la release si elle n'existe pas
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag.TrimStart('v') --notes "Mise a jour automatique depuis l'application."
            Write-Output "Release $tag creee."
          } else {
            Write-Output "Release $tag deja presente, reutilisee."
          }

      - name: Publier l'installeur et latest.yml
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
